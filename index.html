<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>精选商品</title>
  <style>
    :root{--bg:#192a3c;--deep:#0e1822;--panel:#1b2d3d;--line:#31546d;--muted:#91a6b7;--text:#edf6ff;--cyan:#67c1f5;--blue:#1a9fff;--green:#a4d007;--lime:#d7f65a;--shadow:0 20px 60px #0008}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;color:var(--text);font:14px/1.5 Arial,"Microsoft YaHei",sans-serif;background:radial-gradient(circle at 80% 0,#24445c 0,transparent 36%),linear-gradient(180deg,#1b3448 0,#192a3c 280px,#0d151e 100%);background-attachment:fixed}button{font:inherit}.shell{width:min(1180px,calc(100% - 32px));margin:auto}.topbar{height:104px;background:#171d25;display:flex;align-items:center;box-shadow:0 1px 10px #0008}.nav{display:flex;align-items:center;gap:42px}.brand{display:flex;align-items:center;gap:12px;font-size:26px;letter-spacing:.8px;color:#fff}.mark{width:42px;height:42px;border:3px solid #fff;border-radius:50%;position:relative}.mark:after{content:"";position:absolute;width:14px;height:14px;border:3px solid #fff;border-radius:50%;right:-6px;bottom:-3px;box-shadow:-18px -10px 0 -4px #fff}.navlinks{display:flex;gap:25px;text-transform:uppercase}.navlinks a{color:#d6d7d8;text-decoration:none}.navlinks a:first-child{color:#1a9fff;border-bottom:3px solid #1a9fff}.hero{padding:62px 0 34px}.eyebrow{color:var(--cyan);letter-spacing:.18em;text-transform:uppercase;font-weight:bold}.hero h1{font-size:clamp(34px,7vw,68px);line-height:1;margin:9px 0 18px;letter-spacing:-.04em;text-transform:uppercase}.hero p{max-width:590px;margin:0;color:#b7c9d8;font-size:16px}.catalog-head{display:flex;align-items:flex-end;justify-content:space-between;margin:14px 0 18px}.catalog-head h2{margin:0;font-size:18px;text-transform:uppercase;letter-spacing:.08em}.count{color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-flow:dense;grid-auto-rows:32px;gap:14px;padding-bottom:80px}.card{grid-column:span 4;grid-row:span 10;min-height:306px;position:relative;overflow:hidden;border:1px solid #4b789422;background:#142431;box-shadow:0 8px 28px #0005;cursor:pointer;transition:transform .22s,border-color .22s,box-shadow .22s;isolation:isolate}.card.wide{grid-column:span 8}.card.tall{grid-row:span 15}.card:hover,.card:focus-visible{transform:translateY(-5px);border-color:var(--cyan);box-shadow:0 18px 42px #0009;outline:0}.art{position:absolute;inset:0 0 86px;background:#0b1117}.art img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .55s,opacity .25s}.card:hover .art img{transform:scale(1.035)}.shade{position:absolute;inset:38% 0 0;background:linear-gradient(transparent,#0b131ce8 62%,#0b131c)}.sold-overlay{position:absolute;z-index:4;inset:0 0 86px;display:flex;align-items:center;justify-content:center;background:#071019a8;color:#fff;font-size:clamp(22px,3vw,38px);font-weight:700;letter-spacing:.18em;text-shadow:0 2px 14px #000}.info{position:absolute;z-index:2;left:0;right:0;bottom:0;min-height:96px;padding:18px 18px 14px;background:linear-gradient(90deg,#172f40,#101c28)}.title{margin:0 0 9px;font-size:18px;line-height:1.2}.meta{display:flex;align-items:center;justify-content:space-between;gap:10px}.pricebox{display:flex;align-items:stretch;margin-left:auto;color:#b9dce9}.discount{padding:6px 8px;background:#4c6b22;color:var(--lime);font-size:20px;font-weight:bold}.prices{min-width:67px;padding:3px 8px;text-align:right;background:#233a4b}.old{display:block;color:#738895;font-size:11px;text-decoration:line-through}.new{color:#d8f0fa}.dots{display:flex;gap:5px}.dot{width:18px;height:3px;border:0;background:#68809666;padding:0}.dot.active{background:var(--cyan)}.badge{position:absolute;z-index:3;top:12px;right:12px;padding:5px 9px;background:#0c1721cc;color:#d6eaf6;font-size:11px;letter-spacing:.1em;text-transform:uppercase}.error{grid-column:1/-1;padding:24px;background:#301f26;border:1px solid #a55;color:#ffd5d5}
    dialog{width:min(1020px,calc(100% - 28px));max-height:92vh;padding:0;border:1px solid #4c7188;background:#142432;color:var(--text);box-shadow:var(--shadow);overflow:auto}dialog::backdrop{background:#05090dcc;backdrop-filter:blur(5px)}.close{position:sticky;display:block;top:12px;margin:12px 12px -50px auto;z-index:9;width:38px;height:38px;border:0;background:#0b141dcc;color:#fff;font-size:25px;cursor:pointer}.modal-media{display:flex;align-items:center;justify-content:center;min-height:180px;max-height:70vh;overflow:hidden;background:radial-gradient(circle at center,#182b3a,#080d12 72%);position:relative}.modal-media img{display:block;width:auto;height:auto;max-width:100%;max-height:70vh;object-fit:contain}.modal-body{padding:26px 30px 32px}.modal-body h2{font-size:30px;margin:0 0 9px}.modal-body p{color:#b9cad6;white-space:pre-line;max-width:760px}.modal-thumbs{display:flex;gap:8px;overflow:auto;margin-top:18px}.thumb{width:112px;height:63px;flex:none;padding:0;border:2px solid transparent;background:#000;cursor:pointer}.thumb.active{border-color:var(--cyan)}.thumb img{width:100%;height:100%;object-fit:cover}.modal-price{display:flex;align-items:center;gap:12px;margin-top:22px;font-size:18px}.hint{color:#6d8799;font-size:12px;margin-top:10px}
    @media(max-width:820px){.topbar{height:76px}.navlinks{display:none}.hero{padding-top:42px}.card,.card.wide{grid-column:span 6}.card.tall{grid-row:span 12}}
    @media(max-width:540px){.shell{width:min(100% - 20px,1180px)}.hero h1{font-size:40px}.grid{grid-template-columns:1fr;display:grid;grid-auto-rows:auto}.card,.card.wide,.card.tall{grid-column:auto;grid-row:auto;height:360px}.modal-media,.modal-media img{max-height:60vh}.modal-body{padding:20px}.modal-body h2{font-size:24px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <header class="topbar"><div class="shell nav"><div class="brand"><span class="mark" aria-hidden="true"></span><span>STEAM</span></div><nav class="navlinks" aria-label="主导航"><a href="#store">商店</a><a href="#">社区</a><a href="#">关于</a></nav></div></header>
  <main class="shell" id="store"><section class="hero"><div class="eyebrow">探索精彩内容</div><h1>精选商品</h1><p>浏览精心挑选的内容，通过图片快速了解每件商品。</p></section><div class="catalog-head"><h2>热门与推荐</h2><span class="count" id="count"></span></div><section class="grid" id="grid" aria-live="polite"></section></main>
  <dialog id="detail"><button class="close" aria-label="关闭">×</button><div class="modal-media"><img id="modalImage" alt=""></div><div class="modal-body"><h2 id="modalTitle"></h2><p id="modalDescription"></p><div class="modal-thumbs" id="modalThumbs"></div><div class="modal-price" id="modalPrice"></div><div class="hint">按 Esc 或点击背景关闭</div></div></dialog>
  <script>
    const euro = new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'});
    const money = n => typeof n === 'number' ? euro.format(n) : n;
    function shuffle(items){
      const result=[...items];
      for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]]}
      return result;
    }
    const grid = document.querySelector('#grid'), dialog = document.querySelector('#detail');
    let products = [];
    function priceHTML(p){
      if(!p.discount) return `<div class="prices"><span class="new">${money(p.price)}</span></div>`;
      const final = p.salePrice ?? (typeof p.price === 'number' ? p.price * (100-p.discount)/100 : p.price);
      return `<div class="discount">-${p.discount}%</div><div class="prices"><span class="old">${money(p.price)}</span><span class="new">${money(final)}</span></div>`;
    }
    function makeCard(p,i){
      const el=document.createElement('article'); el.className=`card ${p.layout||''}`; el.tabIndex=0; el.setAttribute('role','button'); el.setAttribute('aria-label',`查看 ${p.name} 详情`);
      const pics=p.images?.length?p.images:['']; let at=0;
      el.innerHTML=`<div class="art"><img src="${pics[0]}" alt="${p.name}" loading="lazy"></div><div class="shade"></div>${p.sold?'<div class="sold-overlay">卖掉了</div>':''}${p.tag?`<span class="badge">${p.tag}</span>`:''}<div class="info"><h3 class="title">${p.name}</h3><div class="meta"><div class="dots">${pics.map((_,n)=>`<button class="dot ${n?'':'active'}" aria-label="第 ${n+1} 张图片"></button>`).join('')}</div><div class="pricebox">${priceHTML(p)}</div></div></div>`;
      const img=el.querySelector('img'),dots=[...el.querySelectorAll('.dot')];
      function show(n){at=n;img.style.opacity=.15;setTimeout(()=>{img.src=pics[n];img.style.opacity=1},120);dots.forEach((d,j)=>d.classList.toggle('active',j===n))}
      dots.forEach((d,n)=>d.onclick=e=>{e.stopPropagation();show(n)});
      if(pics.length>1) el.onmousemove=e=>{const r=el.getBoundingClientRect();show(Math.min(pics.length-1,Math.floor((e.clientX-r.left)/r.width*pics.length)))};
      const open=()=>openDetail(i);el.onclick=open;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}};return el;
    }
    function openDetail(i){
      const p=products[i],pics=p.images||[]; document.querySelector('#modalTitle').textContent=p.name;document.querySelector('#modalImage').src=pics[0]||'';document.querySelector('#modalImage').alt=p.name;
      const desc=document.querySelector('#modalDescription');desc.textContent=p.description||'';desc.hidden=!p.description;
      const thumbs=document.querySelector('#modalThumbs');thumbs.innerHTML=pics.map((src,n)=>`<button class="thumb ${n?'':'active'}" aria-label="查看第 ${n+1} 张图"><img src="${src}" alt=""></button>`).join('');thumbs.hidden=pics.length<2;
      [...thumbs.children].forEach((b,n)=>b.onclick=()=>{document.querySelector('#modalImage').src=pics[n];[...thumbs.children].forEach((x,j)=>x.classList.toggle('active',j===n))});
      document.querySelector('#modalPrice').innerHTML=`<div class="pricebox">${priceHTML(p)}</div>`;dialog.showModal();
    }
    dialog.querySelector('.close').onclick=()=>dialog.close();dialog.onclick=e=>{if(e.target===dialog)dialog.close()};
    fetch('./config.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{const all=data.products||[];products=[...shuffle(all.filter(p=>!p.sold)),...shuffle(all.filter(p=>p.sold))];document.querySelector('#count').textContent=`${products.length} 件商品`;products.forEach((p,i)=>grid.append(makeCard(p,i)))}).catch(()=>grid.innerHTML='<div class="error">无法读取 config.json。请通过本地服务器打开此页面（不要直接双击 index.html）。</div>');
  </script>
</body>
</html>
